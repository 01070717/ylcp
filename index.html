<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日資訊與 POS 查詢 Dashboard</title>
  <!-- Tailwind CSS 快速排版 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between pb-16">

  <!-- 1. 天氣警告醒目提示列 -->
  <div id="warningBar" class="hidden bg-red-600 text-white px-4 py-2 text-sm font-bold flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2">
      <span class="animate-pulse">⚠️</span>
      <span id="warningText">警告訊息載入中...</span>
    </div>
  </div>

  <!-- 頂部列 -->
  <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">每日資訊 Dashboard</h1>
    <span class="text-xs bg-blue-500 text-white px-2 py-1 rounded">Google Sheets 連線中</span>
  </header>

  <!-- 主內容區域（支援滑動手勢） -->
  <main id="swipeContainer" class="flex-1 p-4 max-w-lg mx-auto w-full select-none touch-pan-y space-y-4">
    
    <!-- 日期導覽卡片 -->
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow">
      <button onclick="changeDate(-1)" class="px-3 py-1.5 text-sm font-medium text-blue-600 hover:bg-blue-50 rounded-lg border border-blue-200">← 上一天</button>
      <div id="currentDateDisplay" class="text-lg font-bold text-center text-slate-800">載入中...</div>
      <button onclick="changeDate(1)" class="px-3 py-1.5 text-sm font-medium text-blue-600 hover:bg-blue-50 rounded-lg border border-blue-200">下一天 →</button>
    </div>

    <!-- 香港天文台即時天氣卡片 -->
    <div class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 p-4 rounded-xl shadow">
      <div class="flex justify-between items-center mb-2 border-b border-blue-100 pb-2">
        <span class="text-xs font-bold text-blue-600 tracking-wider">香港天文台即時天氣</span>
        <span id="weatherUpdateTime" class="text-xs text-slate-400">--:--</span>
      </div>

      <div class="flex items-center space-x-4">
        <!-- 天氣圖示區域 -->
        <div class="flex-shrink-0 relative w-16 h-16 flex items-center justify-center">
          <img id="weatherIcon" class="w-16 h-16 object-contain hidden" alt="Weather Icon" onerror="handleImageError()" />
          <div id="weatherIconPlaceholder" class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-3xl">🌤️</div>
        </div>

        <!-- 氣溫與狀況描述 -->
        <div class="flex-1">
          <div id="temperatureDisplay" class="text-3xl font-extrabold text-slate-800">--°C</div>
          <div id="weatherDesc" class="text-sm font-semibold text-slate-600">讀取天文台資料中...</div>
        </div>
      </div>

      <!-- 細項數據 (濕度 / UV) -->
      <div id="weatherDetails" class="grid grid-cols-2 gap-2 mt-3 pt-2 border-t border-blue-100 text-xs text-slate-500 hidden">
        <div>相對濕度: <span id="humidityVal" class="font-bold text-slate-700">--</span></div>
        <div>UV 指數: <span id="uvVal" class="font-bold text-slate-700">--</span></div>
      </div>
    </div>

    <!-- 職員值班表卡片 (來自 DutyRoster Sheet) -->
    <div class="bg-white p-4 rounded-xl shadow">
      <div class="flex items-center space-x-2 text-sm font-bold text-indigo-600 mb-2 border-b pb-2">
        <span>👥</span>
        <span>職員值班表</span>
      </div>
      <div id="rosterList" class="space-y-3">
        <div class="text-sm text-slate-400 italic">載入資料中...</div>
      </div>
    </div>

    <!-- 當日預定活動卡片 (來自 DailyOverview Sheet) -->
    <div class="bg-white p-4 rounded-xl shadow">
      <div class="flex items-center space-x-2 text-sm font-bold text-red-500 mb-2 border-b pb-2">
        <span>📌</span>
        <span>當日預定活動</span>
      </div>
      <div id="eventsList" class="space-y-3">
        <div class="text-slate-400 text-sm italic">載入資料中...</div>
      </div>
    </div>

    <!-- 活動空檔查詢卡片 -->
    <div class="bg-white p-4 rounded-xl shadow">
      <div class="flex items-center space-x-2 text-sm font-bold text-amber-600 mb-3 border-b pb-2">
        <span>🔍</span>
        <span>活動空檔查詢</span>
      </div>
      <div class="flex space-x-2 mb-3">
        <input 
          type="date" 
          id="slotSearchDate" 
          class="flex-1 px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
        />
        <button 
          onclick="searchActivitySlot()" 
          class="px-4 py-1.5 text-sm font-medium bg-amber-500 hover:bg-amber-600 text-white rounded-lg shadow-sm">
          查詢
        </button>
      </div>
      <!-- 查詢結果區域 -->
      <div id="slotSearchResult" class="space-y-3 text-xs">
        <div class="text-slate-400 italic text-center py-2">請選擇日期查詢</div>
      </div>
    </div>

    <!-- POS 存貨查詢卡片 (來自 pos Sheet) -->
    <div class="bg-white p-4 rounded-xl shadow">
      <div class="flex items-center space-x-2 text-sm font-bold text-emerald-600 mb-3 border-b pb-2">
        <span>📦</span>
        <span>POS 產品存貨查詢</span>
      </div>
      <!-- 搜尋欄 -->
      <div class="mb-3">
        <input 
          type="text" 
          id="posSearchInput" 
          oninput="searchPOS()" 
          placeholder="輸入 SKU、中文或英文名稱搜尋..." 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
        />
      </div>
      <!-- 查詢結果列表 -->
      <div id="posResultList" class="space-y-2 max-h-60 overflow-y-auto divide-y divide-slate-100">
        <div class="text-xs text-slate-400 italic text-center py-2">請輸入關鍵字進行搜尋</div>
      </div>
    </div>

  </main>

  <footer class="text-center p-4 text-xs text-slate-400">
    左右滑動螢幕切換日期 | 資料來源 香港天文台 Open Data API
  </footer>

  <script>
    // --- 1. 設定與變數 ---
    let currentDate = new Date();
    
    // Google Apps Script Web App URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZyGKBgZCXkuvHNEbI1_cbs6mq9eHWXOTBMUMvTRtV0fLtvAzMIZXjRJk_Ojd1pNlA/exec";

    let cachedSheetsData = null;

    // 格式化 Date 物件為本地時區 YYYY-MM-DD，避免 toISOString() 時區扣減 8 小時問題
    function formatDateLocal(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatIconCode(code) {
      if (code === undefined || code === null) return null;
      let str = String(code).trim();
      return str.length === 1 ? '0' + str : str;
    }

    function handleImageError() {
      document.getElementById("weatherIcon").classList.add("hidden");
      document.getElementById("weatherIconPlaceholder").classList.remove("hidden");
    }

    // 依據值班狀態回傳對應卡片顏色樣式 (AL/CL黃色, SL綠色, OFF/休/PH紅色)
    function getShiftCardStyle(shift) {
      const cleanShift = String(shift || "").trim().toUpperCase();

      if (cleanShift === 'AL' || cleanShift === 'CL') {
        return {
          card: 'bg-amber-50 border-amber-200',
          name: 'text-amber-700',
          shift: 'text-amber-600'
        };
      } else if (cleanShift === 'SL') {
        return {
          card: 'bg-emerald-50 border-emerald-200',
          name: 'text-emerald-700',
          shift: 'text-emerald-600'
        };
      } else if (cleanShift === 'OFF' || cleanShift === '休' || cleanShift === 'PH') {
        return {
          card: 'bg-rose-50 border-rose-200',
          name: 'text-rose-700',
          shift: 'text-rose-600'
        };
      } else {
        // 一般上班班次預設樣式
        return {
          card: 'bg-slate-50 border-slate-200',
          name: 'text-slate-500',
          shift: 'text-indigo-700'
        };
      }
    }

    // --- 2. 天文台 API 介接邏輯 ---
    async function fetchHKOWeather(targetDate) {
      const todayStr = formatDateLocal(new Date());
      const targetDateStr = formatDateLocal(targetDate);

      document.getElementById("weatherDetails").classList.add("hidden");
      document.getElementById("weatherIcon").classList.add("hidden");
      document.getElementById("weatherIconPlaceholder").classList.remove("hidden");
      document.getElementById("weatherDesc").innerText = "載入天氣中...";

      try {
        if (targetDateStr === todayStr) {
          const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc");
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          const data = await res.json();

          let hkoTemp = null;
          if (Array.isArray(data.temperature?.data)) {
            hkoTemp = data.temperature.data.find(i => i.place === "香港天文台") || data.temperature.data[0];
          }
          document.getElementById("temperatureDisplay").innerText = hkoTemp?.value !== undefined ? `${hkoTemp.value}°C` : "--°C";

          const humidity = Array.isArray(data.humidity?.data) ? data.humidity.data[0]?.value : null;
          const uvObj = Array.isArray(data.uvindex?.data) ? data.uvindex.data[0] : null;

          if (humidity !== null && humidity !== undefined) {
            document.getElementById("humidityVal").innerText = `${humidity}%`;
            document.getElementById("weatherDetails").classList.remove("hidden");
          }
          
          if (uvObj?.value !== undefined) {
            document.getElementById("uvVal").innerText = `${uvObj.value} (${uvObj.desc || ''})`;
            document.getElementById("weatherDetails").classList.remove("hidden");
          } else {
            document.getElementById("uvVal").innerText = "無 (夜間/未發布)";
          }

          if (Array.isArray(data.icon) && data.icon.length > 0) {
            const iconCode = formatIconCode(data.icon[0]);
            if (iconCode) {
              const iconImg = document.getElementById("weatherIcon");
              iconImg.src = `https://www.hko.gov.hk/images/HKOWeb_Icon/pic${iconCode}.png`;
              iconImg.onload = () => {
                iconImg.classList.remove("hidden");
                document.getElementById("weatherIconPlaceholder").classList.add("hidden");
              };
            }
          }

          const hasRain = Array.isArray(data.rainfall?.data) && data.rainfall.data.some(r => r.max > 0);
          document.getElementById("weatherDesc").innerText = hasRain ? "部分地區錄得降雨" : "當前即時氣溫";
          document.getElementById("weatherUpdateTime").innerText = data.updateTime ? data.updateTime.substring(11, 16) : "";

          const warningBar = document.getElementById("warningBar");
          if (Array.isArray(data.warningMessage) && data.warningMessage.length > 0) {
            warningBar.classList.remove("hidden");
            document.getElementById("warningText").innerText = data.warningMessage.join(' | ');
          } else if (typeof data.warningMessage === 'string' && data.warningMessage.trim() !== '') {
            warningBar.classList.remove("hidden");
            document.getElementById("warningText").innerText = data.warningMessage;
          } else {
            warningBar.classList.add("hidden");
          }

        } else {
          document.getElementById("warningBar").classList.add("hidden");
          const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc");
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          const data = await res.json();

          const formattedTargetDate = targetDateStr.replace(/-/g, '');
          const forecast = Array.isArray(data.weatherForecast) 
            ? data.weatherForecast.find(i => i.forecastDate === formattedTargetDate)
            : null;

          if (forecast) {
            document.getElementById("temperatureDisplay").innerText = `${forecast.forecastMintemp.value}°C - ${forecast.forecastMaxtemp.value}°C`;
            document.getElementById("weatherDesc").innerText = forecast.forecastWeather || "預報資料";
            document.getElementById("weatherUpdateTime").innerText = "預報";

            const iconCode = formatIconCode(forecast.ForecastIcon);
            if (iconCode) {
              const iconImg = document.getElementById("weatherIcon");
              iconImg.src = `https://www.hko.gov.hk/images/HKOWeb_Icon/pic${iconCode}.png`;
              iconImg.onload = () => {
                iconImg.classList.remove("hidden");
                document.getElementById("weatherIconPlaceholder").classList.add("hidden");
              };
            }
          } else {
            document.getElementById("temperatureDisplay").innerText = "--°C";
            document.getElementById("weatherDesc").innerText = "超出天文台 9 天預報範圍";
            document.getElementById("weatherUpdateTime").innerText = "";
          }
        }
      } catch (err) {
        console.error("天文台 API 解析錯誤:", err);
        document.getElementById("weatherDesc").innerText = "天氣載入失敗";
      }
    }

    // --- 3. Google Sheets 資料讀取與解析 ---
    async function fetchGoogleSheetsData() {
      if (cachedSheetsData) return cachedSheetsData;
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const data = await response.json();
        cachedSheetsData = data;
        return data;
      } catch (e) {
        console.error("Google Sheets API 讀取失敗:", e);
        return null;
      }
    }

    function formatDateString(rawDate) {
      if (!rawDate) return "";
      let str = String(rawDate).trim();
      
      if (str.includes("T")) {
        let d = new Date(str);
        if (!isNaN(d.getTime())) return formatDateLocal(d);
      }
      
      if (str.length >= 10 && str.charAt(4) === '-' && str.charAt(7) === '-') {
        return str.substring(0, 10);
      }

      let d = new Date(str);
      if (isNaN(d.getTime())) return str;
      return formatDateLocal(d);
    }

    function formatTimeString(rawTime) {
      if (!rawTime) return "--:--";
      if (typeof rawTime === 'string') return rawTime.substring(0, 5);
      let d = new Date(rawTime);
      if (!isNaN(d.getTime())) {
        let hours = String(d.getHours()).padStart(2, '0');
        let mins = String(d.getMinutes()).padStart(2, '0');
        return `${hours}:${mins}`;
      }
      return String(rawTime);
    }

    async function renderExcelData(dateStr) {
      const data = await fetchGoogleSheetsData();
      
      if (!data) {
        document.getElementById("eventsList").innerHTML = '<div class="text-red-400 text-sm">Google Sheets 資料讀取失敗</div>';
        document.getElementById("rosterList").innerHTML = '<div class="text-sm text-red-400">Google Sheets 資料讀取失敗</div>';
        return;
      }

      // --- A. 渲染 DailyOverview 特別活動 ---
      const overviewRows = (data.overview || []).slice(1);
      const matchedEvents = overviewRows.filter(row => formatDateString(row[0]) === dateStr);

      if (matchedEvents.length > 0) {
        let htmlHtml = "";
        matchedEvents.forEach(row => {
          const startTime = formatTimeString(row[1]);
          const endTime = formatTimeString(row[2]);
          const eventName = row[3] || "未命名活動";
          const eventType = row[4] ? ` (${row[4]})` : "";
          const pic = row[5] || "無";

          htmlHtml += `
            <div class="p-3 bg-red-50/60 border border-red-100 rounded-lg space-y-1">
              <div class="flex justify-between items-center text-xs font-semibold text-red-700">
                <span>⏰ ${startTime} - ${endTime}</span>
                <span class="bg-red-100 text-red-800 px-2 py-0.5 rounded-full">👤 PIC: ${pic}</span>
              </div>
              <div class="text-sm font-bold text-slate-800">
                📌 ${eventName}<span class="text-xs font-normal text-slate-500">${eventType}</span>
              </div>
            </div>
          `;
        });
        document.getElementById("eventsList").innerHTML = htmlHtml;
      } else {
        document.getElementById("eventsList").innerHTML = '<div class="text-slate-400 text-sm italic">今日無特別活動</div>';
      }

      // --- B. 渲染 DutyRoster 職員值班表 ---
      const rosterRows = (data.roster || []).slice(1);
      const headers = (data.roster || [])[0] || [];
      const matchedRoster = rosterRows.find(row => formatDateString(row[0]) === dateStr);

      if (matchedRoster) {
        const createStaffCard = (index) => {
          const staffName = headers[index] || `Staff${String(index).padStart(2, '0')}`;
          const shift = matchedRoster[index] || "休";
          const style = getShiftCardStyle(shift);

          return `
            <div class="${style.card} p-2 rounded border text-center transition-colors">
              <div class="text-xs ${style.name} truncate">${staffName}</div>
              <div class="text-sm font-bold ${style.shift} truncate">${shift}</div>
            </div>
          `;
        };

        const renderStaffGroup = (startIndex, endIndex) => {
          let cols = [];
          for (let i = startIndex; i <= endIndex; i++) {
            cols.push(createStaffCard(i));
          }
          return `<div class="grid grid-cols-4 gap-2">${cols.join('')}</div>`;
        };

        const row1 = renderStaffGroup(1, 4);
        const row2 = renderStaffGroup(5, 8);
        const row3 = `
          <div class="grid grid-cols-2 gap-2 max-w-[50%]">
            ${matchedRoster[9] !== undefined ? createStaffCard(9) : ''}
            ${matchedRoster[10] !== undefined ? createStaffCard(10) : ''}
          </div>
        `;

        document.getElementById("rosterList").innerHTML = `
          <div class="space-y-2">
            ${row1}
            ${row2}
            ${row3}
          </div>
        `;
      } else {
        document.getElementById("rosterList").innerHTML = '<div class="text-sm text-slate-400 italic">本日無排班記錄</div>';
      }
    }

    // --- 3.5 活動空檔查詢卡片邏輯 ---
    async function searchActivitySlot(targetDateStr) {
      const searchDate = targetDateStr || document.getElementById("slotSearchDate").value;
      const resultContainer = document.getElementById("slotSearchResult");

      if (!searchDate) {
        resultContainer.innerHTML = '<div class="text-slate-400 italic text-center py-2">請選擇日期查詢</div>';
        return;
      }

      const data = await fetchGoogleSheetsData();
      if (!data) {
        resultContainer.innerHTML = '<div class="text-red-400 text-center py-2">資料讀取失敗</div>';
        return;
      }

      // 1. 查詢活動清單
      const overviewRows = (data.overview || []).slice(1);
      const matchedEvents = overviewRows.filter(row => formatDateString(row[0]) === searchDate);

      let eventsHtml = "";
      if (matchedEvents.length > 0) {
        eventsHtml = matchedEvents.map(row => {
          const startTime = formatTimeString(row[1]);
          const endTime = formatTimeString(row[2]);
          const eventName = row[3] || "未命名活動";
          return `<li class="text-slate-700">🕒 <b>${startTime}-${endTime}</b>: ${eventName}</li>`;
        }).join("");
      } else {
        eventsHtml = `<li class="text-slate-400 italic">該日無預定活動</li>`;
      }

      // 2. 查詢指定職員 (Robin, Lawrence, Anson, Grace) 的班表
      const rosterRows = (data.roster || []).slice(1);
      const headers = (data.roster || [])[0] || [];
      const matchedRoster = rosterRows.find(row => formatDateString(row[0]) === searchDate);

      const targetStaffs = ["Robin", "Lawrence", "Anson", "Grace"];
      let staffHtml = "";

      if (matchedRoster) {
        staffHtml = targetStaffs.map(staff => {
          const staffIndex = headers.findIndex(h => String(h || "").trim().toLowerCase() === staff.toLowerCase());
          const shift = (staffIndex !== -1 && matchedRoster[staffIndex]) ? matchedRoster[staffIndex] : "無紀錄";
          const style = getShiftCardStyle(shift);

          return `
            <div class="${style.card} p-1.5 rounded border text-center">
              <div class="font-bold text-slate-700">${staff}</div>
              <div class="${style.shift} font-semibold">${shift}</div>
            </div>
          `;
        }).join("");
      } else {
        staffHtml = `<div class="col-span-4 text-slate-400 italic text-center">無排班資料</div>`;
      }

      resultContainer.innerHTML = `
        <div class="bg-amber-50/50 p-2.5 rounded-lg border border-amber-100 space-y-2">
          <div>
            <div class="font-bold text-slate-700 mb-1">📅 ${searchDate} 預定活動：</div>
            <ul class="list-disc list-inside space-y-1 pl-1">
              ${eventsHtml}
            </ul>
          </div>
          <div class="border-t border-amber-200/60 pt-2">
            <div class="font-bold text-slate-700 mb-1.5">👤 指定職員排班狀況：</div>
            <div class="grid grid-cols-4 gap-1.5">
              ${staffHtml}
            </div>
          </div>
        </div>
      `;
    }

    // --- 4. POS 存貨即時搜尋邏輯 ---
    async function searchPOS() {
      const keyword = document.getElementById("posSearchInput").value.trim().toLowerCase();
      const resultContainer = document.getElementById("posResultList");

      if (!keyword) {
        resultContainer.innerHTML = '<div class="text-xs text-slate-400 italic text-center py-2">請輸入關鍵字進行搜尋</div>';
        return;
      }

      const data = await fetchGoogleSheetsData();
      if (!data || !data.pos) {
        resultContainer.innerHTML = '<div class="text-xs text-red-400 text-center py-2">POS 資料載入失敗</div>';
        return;
      }

      const posRows = data.pos.slice(1);
      
      const filtered = posRows.filter(row => {
        const sku = String(row[0] || "").toLowerCase();
        const enName = String(row[1] || "").toLowerCase();
        const cnName = String(row[2] || "").toLowerCase();
        return sku.includes(keyword) || enName.includes(keyword) || cnName.includes(keyword);
      });

      if (filtered.length === 0) {
        resultContainer.innerHTML = '<div class="text-xs text-slate-400 text-center py-2">找不到匹配的產品</div>';
        return;
      }

      resultContainer.innerHTML = filtered.map(row => {
        const enName = row[1] || "";
        const cnName = row[2] || "無中文名稱";
        const selling = row[4] !== undefined ? `$${row[4]}` : "N/A";
        const stock = row[5] !== undefined ? row[5] : 0;
        const stockClass = stock <= 5 ? "text-red-600 font-bold" : "text-emerald-600 font-bold";

        return `
          <div class="py-2 flex justify-between items-center text-xs">
            <div class="pr-2">
              <div class="font-bold text-slate-800">${cnName}</div>
              <div class="text-slate-400 text-[11px]">${enName}</div>
            </div>
            <div class="text-right flex-shrink-0">
              <div class="text-slate-700 font-semibold">售價: ${selling}</div>
              <div class="text-[11px]">存貨: <span class="${stockClass}">${stock}</span></div>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- 5. 核心流程與手勢切換 ---
    function loadDataForDate(date) {
      const dateStr = formatDateLocal(date);
      document.getElementById("currentDateDisplay").innerText = dateStr;

      // 1. 載入天文台天氣
      fetchHKOWeather(date);

      // 2. 載入 Google Sheets 資料 (活動 & 值班)
      renderExcelData(dateStr);
    }

    function changeDate(days) {
      currentDate.setDate(currentDate.getDate() + days);
      loadDataForDate(currentDate);
    }

    // 手勢左右滑動監聽
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.getElementById("swipeContainer");

    container.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
    container.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) changeDate(1);  // 向左滑 -> 下一天
      if (touchEndX > touchStartX + 50) changeDate(-1); // 向右滑 -> 上一天
    }, false);

    // 初始載入當天資料
    loadDataForDate(currentDate);
  </script>
</body>
</html>
